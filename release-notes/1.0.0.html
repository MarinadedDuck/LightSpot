<h3>LightSpot 1.0.0</h3>
<p>First release.</p>
<ul>
  <li>Puts a clickable magnifying glass in the menu bar that opens the Spotlight search bar.</li>
  <li>Works when Screen Sharing, remote desktop apps or virtual machines are in front.</li>
  <li>Checks for updates once a day, if you allow it.</li>
</ul>
