# Generate the Xcode project with:  xcodegen generate
name: LightSpot
options:
  bundleIdPrefix: io.github.marinadedduck
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.1"

targets:
  LightSpot:
    type: application
    platform: macOS
    sources:
      - path: LightSpot
        excludes:
          - Info.plist
          - AppIcon.icon
      # Icon Composer icon: must be a single file reference so actool compiles it.
      - path: LightSpot/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: Sparkle
    # Signing defaults to local; maintainers override it in Config/Signing.local.xcconfig.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: LightSpot/Info.plist
      properties:
        CFBundleName: LightSpot
        CFBundleDisplayName: LightSpot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSHumanReadableCopyright: "Open source under the MIT License."
        CFBundleURLTypes:
          - CFBundleURLName: io.github.marinadedduck.LightSpot
            CFBundleURLSchemes: [lightspot]
        # Sparkle. The feed is attached to every GitHub release; "latest" always points at the newest.
        SUFeedURL: https://github.com/MarinadedDuck/LightSpot/releases/latest/download/appcast.xml
        SUPublicEDKey: lUTWdiosAz7JSzVoXyUE/MR2Ym0UVOJ/iuuQCQuB8uY=
    settings:
      base:
        PRODUCT_NAME: LightSpot
        PRODUCT_BUNDLE_IDENTIFIER: io.github.marinadedduck.LightSpot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: $(LIGHTSPOT_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(LIGHTSPOT_TEAM)
        COMBINE_HIDPI_IMAGES: YES
